name: QuickRadarGlance

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Shared:
    type: framework
    platform: iOS
    sources: [Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).quickradarglance.shared
        GENERATE_INFOPLIST_FILE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        DEFINES_MODULE: YES

  SharedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SharedTests
    dependencies:
      - target: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).quickradarglance.sharedtests
        GENERATE_INFOPLIST_FILE: YES

  QuickRadarGlance:
    type: application
    platform: iOS
    sources: [QuickRadarGlance]
    dependencies:
      - target: Shared
      - target: QuickRadarGlanceWidget
    info:
      path: QuickRadarGlance/Info.plist
      properties:
        CFBundleDisplayName: QuickRadarGlance
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupIdentifier: group.$(BUNDLE_ID_PREFIX).quickradarglance
        # Only HTTPS (exempt), so App Store Connect doesn't ask about export compliance per build.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [quickradarglance]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocationWhenInUseUsageDescription: >-
          QuickRadarGlance centers the weather radar on where you are, in the app and in
          the CarPlay widget.
    entitlements:
      path: QuickRadarGlance/QuickRadarGlance.entitlements
      properties:
        com.apple.security.application-groups: [group.$(BUNDLE_ID_PREFIX).quickradarglance]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).quickradarglance
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  QuickRadarGlanceWidget:
    type: app-extension
    platform: iOS
    sources: [QuickRadarGlanceWidget]
    dependencies:
      - target: Shared
        embed: false
    info:
      path: QuickRadarGlanceWidget/Info.plist
      properties:
        CFBundleDisplayName: QuickRadarGlance
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupIdentifier: group.$(BUNDLE_ID_PREFIX).quickradarglance
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSWidgetWantsLocation: true
        NSLocationWhenInUseUsageDescription: >-
          QuickRadarGlance centers the weather radar on where you are.
    entitlements:
      path: QuickRadarGlanceWidget/QuickRadarGlanceWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.$(BUNDLE_ID_PREFIX).quickradarglance]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).quickradarglance.widget

schemes:
  QuickRadarGlance:
    build:
      targets:
        QuickRadarGlance: all
        SharedTests: [test]
    test:
      targets: [SharedTests]
    run:
      config: Debug
